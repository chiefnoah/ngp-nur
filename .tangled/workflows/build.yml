when:
  - event: ["push"]
    branch: ["main", "master"]
  - event: ["schedule"]
    schedule:
      - cron: "51 2 * * *"
  - event: ["manual"]

engine: "nixery"

dependencies:
  nixpkgs:
    - nix
    - curl
    - python3

environment:
  NIX_CONFIG: "experimental-features = nix-command flakes"

steps:
  - name: "Register Nixery store paths"
    command: "python3 scripts/ci-register-nixery.py"
  - name: "Evaluate and build packages"
    command: "bash scripts/ci-build.sh"
  - name: "Upload to Misaki"
    command: "bash scripts/ci-upload.sh"
  # Disabled as we have not been merged into the NUR community repo yet
  #- name: "Trigger NUR update"
  #  command: 'curl -fsS -X POST "https://nur-update.nix-community.org/update?repo=chiefnoah"'
